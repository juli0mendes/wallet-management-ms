spring:
  application:
    name: wallet-management-ms
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://walletadmin:walletpass@localhost:27017/wallet_management?authSource=admin&replicaSet=rs0}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

wallet:
  transfer:
    reconciliation:
      enabled: true
      fixed-delay: 30000
      initial-delay: 5000
      batch-limit: 20
      lease-duration: PT5M
      initiated-stale-after: PT5M

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    io.github.juli0mendes.walletmanagement: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n"
